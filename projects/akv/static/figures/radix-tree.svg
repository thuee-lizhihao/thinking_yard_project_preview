<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="title desc">
  <title id="title">An extended radix tree branches on drop timing</title>
  <desc id="desc">Two requests share the A–B prefix. The upper branch appends C while A and B are available, then drops A before generating D. The lower branch drops A before appending C, then generates D. Both retain B and C, but their C cache states differ. A drop marker records the dropped entries and the point of the operation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#aaaab5" stroke-width="1.2"/></marker>
  </defs>
  <g fill="none" stroke="#b8b8c3" stroke-width="2" marker-end="url(#arrow)">
    <path d="M40 165H89"/>
    <path d="M160 165H219"/>
    <path d="M290 165H312Q324 165 324 153V100Q324 88 336 88H365"/>
    <path d="M290 165H312Q324 165 324 177V230Q324 242 336 242H365"/>
    <path d="M442 88H504"/>
    <path d="M608 88H690"/>
    <path d="M470 242H528"/>
    <path d="M606 242H690"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <circle cx="34" cy="165" r="6" fill="#fff" stroke="#aaaab5" stroke-width="2"/>
    <text x="34" y="197" font-size="15" fill="#86868b">root</text>
    <text x="190" y="107" font-size="17" fill="#777780">Shared prefix</text>
    <rect x="92" y="139" width="68" height="52" rx="12" fill="#eeeef2" stroke="#d3d3dc"/>
    <rect x="222" y="139" width="68" height="52" rx="12" fill="#e5efe8" stroke="#bdcfbf"/>
    <text x="126" y="172" font-size="21" fill="#55555f">A</text>
    <text x="256" y="172" font-size="21" fill="#507459">B</text>
    <text x="563" y="37" font-size="18" fill="#5f7dac">Append C, then drop A</text>
    <rect x="368" y="62" width="74" height="52" rx="12" fill="#e6eefb" stroke="#abc2e9"/>
    <text x="405" y="95" font-size="21" fill="#527db7">C</text>
    <rect x="508" y="62" width="100" height="52" rx="26" fill="#fcf7ee" stroke="#d5b888" stroke-dasharray="5 4"/>
    <text x="558" y="94" font-size="19" fill="#967044">Δ(A)</text>
    <rect x="694" y="62" width="68" height="52" rx="12" fill="#fbfbfd" stroke="#d7d7df"/>
    <text x="728" y="95" font-size="21" fill="#777780">D</text>
    <text x="405" y="141" font-size="15" fill="#5f7dac">attends to A + B</text>
    <text x="563" y="191" font-size="18" fill="#8259bb">Drop A, then append C</text>
    <rect x="368" y="216" width="102" height="52" rx="26" fill="#fcf7ee" stroke="#d5b888" stroke-dasharray="5 4"/>
    <text x="419" y="248" font-size="19" fill="#967044">Δ(A)</text>
    <rect x="532" y="216" width="74" height="52" rx="12" fill="#eee6f9" stroke="#c5a9e5"/>
    <text x="569" y="249" font-size="21" fill="#8259bb">C</text>
    <rect x="694" y="216" width="68" height="52" rx="12" fill="#fbfbfd" stroke="#d7d7df"/>
    <text x="728" y="249" font-size="21" fill="#777780">D</text>
    <text x="569" y="295" font-size="15" fill="#8259bb">attends to B only</text>
  </g>
</svg>
