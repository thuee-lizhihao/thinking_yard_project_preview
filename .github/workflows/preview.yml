name: Publish independent AKV preview
on:
  push:
    branches: [preview/akv-project-page]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-preview-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'thuee-lizhihao/thinking_yard_project_preview' && github.ref == 'refs/heads/preview/akv-project-page'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read preview site settings
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
        env:
          GITHUB_PAGES: 'true'
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
      - name: Mark preview and record deployed revision
        run: node scripts/prepare-preview.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
